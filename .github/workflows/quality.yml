name: quality

on:
  push:
    branches:
      - main
      - product/full-platform
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Audit public repository
        run: python scripts/audit_repository.py

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Run automated tests
        run: python -m pytest

      - name: Rebuild deterministic fixtures
        run: |
          python scripts/generate_fixture.py
          python scripts/generate_ids.py
          git diff --exit-code -- data/models/generated/ibc_egress_demo.ifc data/ids/ibc_egress_information_requirements.ids tests/expected/ground_truth.csv

      - name: Run deterministic CLI check
        run: python -m ifc_compliance_mvd.cli check

      - name: Run controlled fixture benchmark smoke
        run: python scripts/benchmark_model.py --iterations 1
